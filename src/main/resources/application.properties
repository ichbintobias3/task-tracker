spring.application.name=tasktracker

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/tasktracker
spring.datasource.username=tasktracker
spring.datasource.password=tasktracker
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:database/migration
